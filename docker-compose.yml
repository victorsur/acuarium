services:
  # Servicio de Base de Datos
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_DATABASE: acuarium
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  # Servicio de la API (Nuestro código)
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/app  # Sincroniza tu carpeta local con el contenedor (Hot Reload)
    environment:
      - DATABASE_URL=mysql+aiomysql://root:root@db/acuarium
      - SECRET_KEY=cambia_esto_por_una_clave_larga_y_aleatoria_en_produccion
      - ADMIN_USERNAME=admin
      - ADMIN_EMAIL=admin@acuarium.local
      - ADMIN_PASSWORD=Admin1234!
    depends_on:
      - db  # Asegura que la DB arranque antes que la API

  # Servicio del Frontend (Vue 3)
  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && npm run dev"
    ports:
      - "5173:5173"
    environment:
      - NODE_ENV=development
    depends_on:
      - api

volumes:
  db_data: # Para que tus peces no se borren si apagas el contenedor